<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-SHOP | Master Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --amz-dark: #131921;
            --amz-navy: #232f3e;
            --g-orange: #ff9900;
            --btn-y: #ffd814;
            --btn-o: #ffa41c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #eaeded; color: #0f1111; }

        /* --- Header Fix: Single G Icon + G-SHOP --- */
        header { background: var(--amz-dark); height: 60px; display: flex; align-items: center; padding: 0 20px; position: sticky; top: 0; z-index: 1000; width: 100%; }
        
        .logo-box { display: flex; align-items: center; text-decoration: none; margin-right: 15px; }
        .g-icon-sq { background: var(--g-orange); color: white; width: 34px; height: 34px; border-radius: 4px; font-weight: 900; font-size: 24px; display: flex; align-items: center; justify-content: center; margin-right: 10px; padding-bottom: 2px; }
        .g-brand-name { color: white; font-size: 24px; font-weight: bold; letter-spacing: 0.5px; }

        .search-container { flex: 1; display: flex; height: 40px; border-radius: 4px; overflow: hidden; background: white; margin: 0 15px; }
        .search-container input { flex: 1; border: none; padding: 0 15px; outline: none; font-size: 15px; }
        .search-btn { background: #febd69; border: none; width: 50px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }

        .nav-tools { display: flex; color: white; gap: 20px; align-items: center; font-size: 12px; }
        .nav-tools b { font-size: 14px; }

        /* --- Navy Navigation --- */
        .navy-strip { background: var(--amz-navy); height: 40px; color: white; display: flex; align-items: center; padding: 0 20px; gap: 20px; font-size: 13px; }
        .navy-strip a { color: white; text-decoration: none; padding: 5px 0; border-bottom: 2px solid transparent; }
        .navy-strip .active { border-bottom: 2px solid var(--g-orange); font-weight: bold; }

        /* --- Main Layout: Fixed Width & Sidebar --- */
        .main-container { display: flex; padding: 20px; gap: 20px; width: 100%; max-width: 100%; }

        aside { width: 240px; flex-shrink: 0; background: white; padding: 20px; border: 1px solid #ddd; border-radius: 4px; height: fit-content; }
        aside h4 { font-size: 15px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 8px; color: #333; }
        aside li { list-style: none; font-size: 13px; padding: 8px 0; color: #444; cursor: pointer; border-radius: 3px; }
        aside .active-li { color: #c45500; font-weight: bold; }

        .product-area { flex-grow: 1; }
        .grid-layout { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

        /* --- Card & 3D Pill Buttons --- */
        .product-card { background: white; border: 1px solid #ddd; border-radius: 4px; padding: 20px; position: relative; display: flex; flex-direction: column; transition: 0.1s; }
        .product-card:hover { border-color: var(--g-orange); }
        
        .promo-badge { position: absolute; top: 10px; left: 10px; background: #e67e22; color: white; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 2px; text-transform: uppercase; }

        .img-box { height: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        .img-box img { max-height: 100%; max-width: 100%; object-fit: contain; }

        .p-title { font-size: 16px; color: #007185; font-weight: 500; margin-bottom: 8px; height: 42px; overflow: hidden; line-height: 1.3; text-decoration: none; }
        .p-price { font-size: 28px; font-weight: 700; margin-bottom: 20px; color: #0f1111; }
        .p-price span { font-size: 14px; vertical-align: top; margin-right: 2px; font-weight: normal; }

        /* Exact Capsule Pill Buttons with 3D Border */
        .pill-btn { width: 100%; padding: 12px; border-radius: 50px; border: 1px solid; cursor: pointer; font-size: 13px; font-weight: 600; margin-bottom: 10px; transition: 0.1s; color: #0f1111; }
        .btn-yellow { background: var(--btn-y); border-color: #a88734; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset; }
        .btn-orange { background: var(--btn-o); border-color: #ca7c1b; box-shadow: 0 1px 0 rgba(255,255,255,.4) inset; }
        .pill-btn:active { transform: translateY(1px); box-shadow: none; }

        footer { background: var(--amz-navy); color: white; padding: 40px; text-align: center; margin-top: 50px; border-top: 5px solid var(--amz-dark); }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <div class="g-icon-sq">G</div>
            <div class="g-brand-name">G-SHOP</div>
        </div>
        
        <div class="search-container">
            <input type="text" placeholder="Search for Massage Chairs, Electronics, Gaming Gadgets...">
            <button class="search-btn"><i class="fa fa-search"></i></button>
        </div>

        <div class="nav-tools">
            <div>Hello, Guru<br><b>Account & Lists</b></div>
            <div style="font-size: 26px; cursor: pointer; position: relative;">
                <i class="fa fa-shopping-cart"></i>
                <span style="position:absolute; top:-5px; right:-8px; background:var(--g-orange); color:black; font-size:10px; padding:1px 5px; border-radius:50%; font-weight:bold;">0</span>
            </div>
        </div>
    </header>

    <div class="navy-strip">
        <a href="#">Today's Deals</a>
        <a href="#" class="active">Electronics</a>
        <a href="#">Gaming</a>
        <a href="#">Sui to Fridge</a>
        <a href="#" style="margin-left:auto; color:#febd69;">Admin Panel</a>
    </div>

    <div class="main-container">
        <aside>
            <h4>Department</h4>
            <ul>
                <li class="active-li">Electronics</li>
                <li>Audio & Music</li>
                <li>Mobiles & Laptops</li>
                <li>Home Appliances</li>
                <li>Gaming Accessories</li>
            </ul>
        </aside>

        <main class="product-area">
            <div class="grid-layout" id="shopGrid">
                </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 G-SHOP Official Store. Designed for Guru930 Business Empire.</p>
    </footer>

    <script>
        const inventory = [
            {t: "Pro Massage Chair X1", p: "3,499", i: "https://m.media-amazon.com/images/I/71Y8S9F0PGL._AC_SL1500_.jpg"},
            {t: "8K Smart TV 75\"", p: "2,999", i: "https://m.media-amazon.com/images/I/91tA43u2rSL._AC_SL1500_.jpg"},
            {t: "Gaming PC RTX 4090", p: "1,999", i: "https://m.media-amazon.com/images/I/71nI6P8qS8L._AC_SL1500_.jpg"},
            {t: "Drone Pro 4K Camera", p: "1,199", i: "https://m.media-amazon.com/images/I/61mI-8-3JML._AC_SL1500_.jpg"},
            {t: "Smart Home Generator", p: "2,499", i: "https://m.media-amazon.com/images/I/81t62l7a9AL._AC_SL1500_.jpg"},
            {t: "Wireless Charger Pad", p: "1,154", i: "https://m.media-amazon.com/images/I/61k9i9y+Q7L._AC_SL1500_.jpg"}
        ];

        const grid = document.getElementById('shopGrid');
        inventory.forEach(item => {
            grid.innerHTML += `
                <div class="product-card">
                    <div class="promo-badge">TOP SELLER</div>
                    <div class="img-box"><img src="${item.i}"></div>
                    <a href="#" class="p-title">${item.t}</a>
                    <div class="p-price"><span>$</span>${item.p}.00</div>
                    <button class="pill-btn btn-yellow">Add to Cart</button>
                    <button class="pill-btn btn-orange">Buy Now</button>
                </div>
            `;
        });
    </script>
</body>
</html>
