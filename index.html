<html lang="en">

    <title>G-SHOP | Future of Shopping</title>

    <style>
        :root {
            --neon-orange: #ff6b00;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --deep-black: #050505;
            --card-border: rgba(255, 107, 0, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--deep-black); color: white; overflow-x: hidden; }

        /* --- Dynamic Animated Header --- */
        header {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--card-border);
        }
        .logo { font-size: 28px; font-weight: 900; letter-spacing: 2px; color: white; text-transform: uppercase; }
        .logo span { color: var(--neon-orange); text-shadow: 0 0 15px var(--neon-orange); }

        .nav-links { display: flex; gap: 30px; }
        .nav-links a { color: #aaa; text-decoration: none; font-size: 14px; transition: 0.3s; text-transform: uppercase; }
        .nav-links a:hover { color: var(--neon-orange); }

        /* --- Hero Section with 3D Feel --- */
        .hero {
            height: 80vh;
            display: flex;
            align-items: center;
            padding: 0 5%;
            background: radial-gradient(circle at 80% 20%, rgba(255, 107, 0, 0.15), transparent);
        }
        .hero-text h1 { font-size: 70px; line-height: 1; margin-bottom: 20px; font-weight: 800; }
        .hero-text p { color: #888; font-size: 18px; max-width: 500px; margin-bottom: 30px; }
        .cta-btn {
            padding: 15px 40px;
            background: var(--neon-orange);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.4);
            transition: 0.4s;
        }
        .cta-btn:hover { transform: scale(1.05); box-shadow: 0 0 50px var(--neon-orange); }
