<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-Shop International</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f3f3; font-family: sans-serif; }
        .nav-dark { background-color: #131921; }
        .amazon-yellow { background-color: #ffd814; border: 1px solid #fcd200; }
        .amazon-orange { background-color: #ffa41c; border: 1px solid #ee940b; }
    </style>
</head>
<body>
    <header class="nav-dark text-white p-2 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="text-2xl font-bold text-[#febd69] cursor-pointer">G-Shop</div>
            <div class="flex-1 flex h-10">
                <input type="text" class="w-full p-2 rounded-l text-black outline-none" placeholder="Search products...">
                <button class="bg-[#febd69] px-6 rounded-r text-black font-bold">🔍</button>
            </div>
            <div class="text-xs font-bold px-2 border border-transparent hover:border-white cursor-pointer">
                <p class="font-normal text-gray-400 text-[10px]">Hello, Gurpreet</p>
                <p>Account & Lists</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="bg-white p-4 border rounded hover:shadow-lg transition flex flex-col">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300" class="h-44 object-contain mb-4">
                <h2 class="text-sm font-bold mb-2 h-10 overflow-hidden">Elite Wireless Pods Pro</h2>
                <div class="text-2xl font-black mb-4 text-[#B12704]">$89.99</div>
                <button onclick="openForm('Elite Wireless Pods Pro', 89.99)" class="amazon-yellow w-full py-2 rounded-full font-bold text-xs mb-2">Add to Cart</button>
                <button onclick="openForm('Elite Wireless Pods Pro', 89.99)" class="amazon-orange w-full py-2 rounded-full font-bold text-xs">Buy Now</button>
            </div>
            <div class="bg-white p-4 border rounded hover:shadow-lg transition flex flex-col">
                <img src="https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=300" class="h-44 object-contain mb-4">
                <h2 class="text-sm font-bold mb-2 h-10 overflow-hidden">UltraSlim 4K Dash Cam</h2>
                <div class="text-2xl font-black mb-4 text-[#B12704]">$119.99</div>
                <button onclick="openForm('UltraSlim 4K Dash Cam', 119.99)" class="amazon-orange w-full py-2 rounded-full font-bold text-xs">Buy Now</button>
            </div>
        </div>
    </main>

    <div id="checkoutBox" class="fixed inset-0 bg-black/70 hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded shadow-2xl overflow-hidden animate-in zoom-in duration-150">
            <div class="bg-gray-100 p-4 border-b flex justify-between font-bold">
                <span>Checkout</span>
                <button onclick="closeForm()" class="text-xl text-gray-400">✕</button>
            </div>
            <form onsubmit="alert('Order Successful!'); closeForm(); return false;" class="p-6 space-y-4">
                <div id="selectedItem" class="text-xs font-bold text-blue-700 mb-2"></div>
                <input required type="text" placeholder="Full Name" class="w-full border p-3 rounded outline-orange-400">
                <input required type="email" placeholder="Email Address" class="w-full border p-3 rounded outline-orange-400">
                <textarea required placeholder="Shipping Address (USA/Canada/UK)" class="w-full border p-3 rounded h-24 outline-orange-400"></textarea>
                <button type="submit" class="w-full amazon-orange py-4 rounded font-black text-lg uppercase shadow-md">Place Your Order</button>
            </form>
        </div>
    </div>

    <script>
        function openForm(name, price) {
            document.getElementById('selectedItem').innerText = "Buying: " + name + " ($" + price + ")";
            document.getElementById('checkoutBox').classList.remove('hidden');
        }
        function closeForm() {
            document.getElementById('checkoutBox').classList.add('hidden');
        }
    </script>
</body>
</html>
