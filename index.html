<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G-SHOP | Official Branding</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --h-bg: #131921; 
            --s-bg: #232f3e; 
            --g-orange: #ff9900; 
            --btn-y: #ffd814;
            --btn-o: #ffa41c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #eaeded; }

        /* --- HEADER FIX: Single G Box + Gap + SHOP --- */
        header { 
            background: var(--h-bg); 
            height: 60px; 
            display: flex; 
            align-items: center; 
            padding: 0 15px; 
            gap: 0; 
            position: sticky; 
            top: 0; 
            z-index: 1000;
        }

        .logo-section { display: flex; align-items: center; text-decoration: none; margin-right: 20px; }
        /* Single G in Orange Box */
        .g-icon-box { background: var(--g-orange); color: white; width: 34px; height: 34px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; }
        /* Thoda Gap aur fir SHOP */
        .shop-text { color: white; font-size: 22px; font-weight: bold; margin-left: 12px; letter-spacing: 1px; }

        .search-container { flex: 1; display: flex; height: 40px; border-radius: 4px; overflow: hidden; background: white; margin: 0 10px; }
        .search-container input { flex: 1; border: none; padding: 0 12px; outline: none; font-size: 14px; }
        .search-btn { background: var(--g-orange); border: none; width: 45px; cursor: pointer; font-size: 18px; color: #333; }

        .nav-tools { display: flex; align-items: center; gap: 20px; color: white; font-size: 12px; white-space: nowrap; margin-left: 10px; }
        .nav-tools b { display: block; font-size: 14px; }
        .cart-box { display: flex; align-items: center; gap: 5px; font-size: 14px; cursor: pointer; font-weight: bold; position: relative; }

        /* --- SUB NAV --- */
        .sub-nav { background: var(--s-bg); height: 40px; color: white; display: flex; align-items: center; padding: 0 15px; gap: 20px; font-size: 13px; }
        .sub-nav a { color: white; text-decoration: none; }
        .sub-nav .active { border-bottom: 2px solid var(--g-orange); font-weight: bold; }

        /* --- LAYOUT --- */
        .main-content { display: flex; padding: 15px; gap: 20px; }

        aside { width: 230px; flex-shrink: 0; background: white; border: 1px solid #ddd; padding: 15px; border-radius: 4px; height: fit-content; }
        aside h4 { font-size: 14px; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 10px; }
        aside li { list-style: none; font-size: 13px; padding: 6px 0; color: #444; cursor: pointer; }
        aside .selected { color: #c45500; font-weight: bold; }

        .grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .card { background: white; border: 1px solid #ddd; border-radius: 4px; padding: 15px; position: relative; display: flex; flex-direction: column; }
        .badge { position: absolute; top: 8px; left: 8px; background: #e67e22; color: white; font-size: 9px; padding: 2px 6px; border-radius: 2px; }

        .img-wrap { height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .img-wrap img { max-height: 100%; max-width: 100%; object-fit: contain; }

        .p-title { font-size: 14px; color: #007185; font-weight: 500; text-decoration: none; height: 36px; overflow: hidden; display: block; }
        .p-price { font-size: 24px; font-weight: 700; margin: 10px 0; }

        /* PILL BUTTONS */
        .btn-pill { width: 100%; padding: 10px; border-radius: 30px; border: 1px solid; cursor: pointer; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
        .btn-y { background: var(--btn-y); border-color: #a88734; }
        .btn-o { background: var(--btn-o); border-color: #ca7c1b; }

        footer { background: var(--s-bg); color: white; padding: 25px; text-align: center; margin-top: 20px; font-size: 12px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <div class="g-icon-box">G</div>
            <div class="shop-text">SHOP</div>
        </div>
        
        <div class="search-container">
            <input type="text" placeholder="Search G-SHOP...">
            <button class="search-btn"><i class="fa fa-search"></i></button>
        </div>

        <div class="nav-tools">
            <div>Hello, Guru<br><b>Account & Lists</b></div>
            <div>Returns<br><b>& Orders</b></div>
            <div class="cart-box">
                <i class="fa fa-shopping-cart" style="font-size: 22px;"></i>
                <span>Cart</span>
            </div>
        </div>
    </header>

    <div class="sub-nav">
        <a href="#">All</a>
        <a href="#" class="active">Electronics</a>
        <a href="#">Gaming</a>
        <a href="#">Home & Kitchen</a>
    </div>

    <div class="main-content">
        <aside>
            <h4>Department</h4>
            <ul>
                <li class="selected">Electronics</li>
                <li>Mobiles</li>
                <li>Laptops</li>
                <li>Accessories</li>
            </ul>
        </aside>

        <main class="grid" id="mainGrid">
            </main>
    </div>

    <footer>
        &copy; 2026 G-SHOP Global. Guru930 Master Engine.
    </footer>

    <script>
        const inventory = [
            {t: "Pro Massage Chair X1", p: "3,499", i: "https://m.media-amazon.com/images/I/71Y8S9F0PGL._AC_SL1500_.jpg"},
            {t: "8K Smart TV 75\"", p: "2,999", i: "https://m.media-amazon.com/images/I/91tA43u2rSL._AC_SL1500_.jpg"},
            {t: "Gaming PC RTX 4090", p: "1,999", i: "https://m.media-amazon.com/images/I/71nI6P8qS8L._AC_SL1500_.jpg"},
            {t: "Drone Pro 4K Camera", p: "1,199", i: "https://m.media-amazon.com/images/I/61mI-8-3JML._AC_SL1500_.jpg"},
            {t: "Smart Home Generator", p: "2,499", i: "https://m.media-amazon.com/images/I/81t62l7a9AL._AC_SL1500_.jpg"},
            {t: "Wireless Charger Pad", p: "1,154", i: "https://m.media-amazon.com/images/I/61k9i9y+Q7L._AC_SL1500_.jpg"}
        ];

        const grid = document.getElementById('mainGrid');
        inventory.forEach(item => {
            grid.innerHTML += `
                <div class="card">
                    <div class="badge">TOP SELLER</div>
                    <div class="img-wrap"><img src="${item.i}"></div>
                    <a href="#" class="p-title">${item.t}</a>
                    <div class="p-price">$${item.p}.00</div>
                    <button class="btn-pill btn-y">Add to Cart</button>
                    <button class="btn-pill btn-o">Buy Now</button>
                </div>
            `;
        });
    </script>
</body>
</html>
